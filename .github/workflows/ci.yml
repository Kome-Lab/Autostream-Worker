name: autostream-worker CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify authored sources and raw distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_artifact_assembly.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_source_integrity.py' -v
          python3 scripts/ci/verify_source_integrity.py \
            --repository Autostream-Worker --tree "$(git rev-parse HEAD)"
          for script in release/installer-tests/*/*.sh; do bash -n "${script}"; done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install Worker media runtime dependencies for the root fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk
      - name: Check service installer syntax
        run: |
          bash -n release/install-autostream-worker
          bash -n release/test-install-autostream-worker-integration.sh
      - name: Test managed service installer with root-owned Linux fixtures
        run: sudo bash release/test-install-autostream-worker-integration.sh
      - run: go test ./...
      - name: Race-test decomposed Worker packages
        timeout-minutes: 15
        env:
          GOMAXPROCS: '2'
        run: go test -mod=readonly -p 1 -race -count=1 ./internal/jobs ./internal/deepgram
      - run: go build ./...

  v3-product-integration-checks:
    name: v3-product-integration-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Required Caption writer, callback, borrow and generation inventory
        run: bash scripts/ci/iu-checks.sh
      - name: Preserve exact root execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iu-worker-root-events-${{ github.sha }}
          path: ${{ runner.temp }}/iu-*.json
          if-no-files-found: error
          retention-days: 14

  v3-product-cross-repository-checks:
    name: v3-product-cross-repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
      IU_WORKER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # A reviewed Encoder candidate with the process helper is required before
      # publishing this second Worker candidate. No live Provider is contacted.
      IU_ER_CANDIDATE_SHA: '7c7ec14d2b06b866ebd5b006331f55ba01da8dfe'
    defaults:
      run:
        working-directory: worker
        shell: bash
    steps:
      - name: Checkout exact Worker candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IU_WORKER_CANDIDATE_SHA }}
          path: worker
          fetch-depth: 0
          persist-credentials: false
      - name: Require a frozen Encoder candidate
        run: |
          set -euo pipefail
          test "$IU_ER_CANDIDATE_SHA" != 0000000000000000000000000000000000000000
          test "${#IU_ER_CANDIDATE_SHA}" = 40
      - name: Checkout exact Encoder candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kome-Lab/Autostream-Encoder-Recorder
          ref: ${{ env.IU_ER_CANDIDATE_SHA }}
          path: encoder
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify exact source trees and the same immutable shared pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IU_WORKER_CANDIDATE_SHA"
          test "$(git -C ../encoder rev-parse HEAD)" = "$IU_ER_CANDIDATE_SHA"
          test "$(go env GOVERSION)" = go1.26.5
          git log -1 --format='Worker tested commit: %H%nWorker tested tree: %T'
          git -C ../encoder log -1 --format='Encoder tested commit: %H%nEncoder tested tree: %T'
          python3 scripts/ci/iu-source-boundary.py
          python3 scripts/ci/iu-module-pin.py 381790940e0fed8532d9396f0a2a40c0bfd0a612 --download
          (cd ../encoder && python3 scripts/ci/iu-source-boundary.py)
          (cd ../encoder && python3 scripts/ci/iu-module-pin.py 8c17e7389ccdb3429f1e59a1a6147b27fe3c3793 --download)
      - name: Actual Caption dispatch and ACK loss to independent Media, Native and Race
        run: |
          set -euo pipefail
          export IU_WS3_ER_SOURCE="$GITHUB_WORKSPACE/encoder"
          for mode in native race; do
            flags=()
            if test "$mode" = race; then
              flags=(-race)
              export CGO_ENABLED=1
            else
              export CGO_ENABLED=0
            fi
            export IU_WS3_ER_BINARY="$RUNNER_TEMP/iu-encoder-worker-$mode.test"
            (cd ../encoder && go test -p 1 "${flags[@]}" -tags=iu_crossrepo -c ./internal/httpapi -o "$IU_WS3_ER_BINARY")
            go test -p 1 "${flags[@]}" -tags=iu_crossrepo -count=1 -timeout=5m -json ./internal/jobs -run '^TestIUWS3CrossRepositoryWorkerMedia(Recorded|ACKLoss)$' | tee "$RUNNER_TEMP/iu-cross-repository-$mode.json"
            python3 scripts/ci/iu-json-events.py scripts/ci/ws3-worker-crossrepo-required-tests.txt "$RUNNER_TEMP/iu-cross-repository-$mode.json"
          done
          # The legacy HTTP observations above retain typed CC04 pending/UNKNOWN;
          # they do not qualify the receiver or establish durable G0 completion.
          git diff --exit-code -- go.mod go.sum
          git -C ../encoder diff --exit-code -- go.mod go.sum
      - name: Preserve cross-repository execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iu-worker-encoder-root-events-${{ github.sha }}
          path: ${{ runner.temp }}/iu-cross-repository-*.json
          if-no-files-found: error
          retention-days: 14

  v3-manual-auto-start-hold-checks:
    name: v3-manual-auto-start-hold-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Required target HTTP, prelaunch, restart and process Barrier roots
        run: bash scripts/ci/msr-checks.sh
      - name: Preserve exact MSR root execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-auto-start-hold-${{ github.sha }}
          path: ${{ runner.temp }}/msr-*.json
          if-no-files-found: error
          retention-days: 14
