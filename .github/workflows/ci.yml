name: autostream-worker CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Bundle 9 authored sources and raw distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_artifact_assembly.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_bundle9_sources.py' -v
          python3 scripts/ci/verify_bundle9_sources.py \
            --repository Autostream-Worker --tree "$(git rev-parse HEAD)"
          for script in release/installer-tests/*/*.sh; do bash -n "${script}"; done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install Worker media runtime dependencies for the root fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk
      - name: Check service installer syntax
        run: |
          bash -n release/install-autostream-worker
          bash -n release/test-install-autostream-worker-integration.sh
      - name: Test managed service installer with root-owned Linux fixtures
        run: sudo bash release/test-install-autostream-worker-integration.sh
      - run: go test ./...
      - name: Race-test decomposed Worker packages
        timeout-minutes: 15
        env:
          GOMAXPROCS: '2'
        run: go test -mod=readonly -p 1 -race -count=1 ./internal/jobs ./internal/deepgram
      - run: go build ./...
