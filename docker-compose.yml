services:
  worker:
    build: .
    env_file: .env.example
    environment:
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-worker/config.yml
      CREDENTIALS_DIRECTORY: /run/autostream-credentials
    configs:
      - source: node-listener
        target: /run/autostream-credentials/node-listener.json
    ports:
      - "127.0.0.1:${AUTOSTREAM_WORKER_PORT:-8084}:${AUTOSTREAM_WORKER_CONTAINER_PORT:-8080}"
    volumes:
      - ./config/config.yml:/etc/autostream-worker/config.yml:ro

configs:
  node-listener:
    content: |
      {"schema_version":2,"service_type":"worker","bind_address":"0.0.0.0:${AUTOSTREAM_WORKER_CONTAINER_PORT:-8080}","config_revision":${AUTOSTREAM_CONFIG_REVISION:?AUTOSTREAM_CONFIG_REVISION is required}}
