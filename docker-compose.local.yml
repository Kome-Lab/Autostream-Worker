services:
  worker:
    environment:
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-worker/config.yml
      AUTOSTREAM_CONFIG_REVISION: ${AUTOSTREAM_CONFIG_REVISION:-1}
      SERVICE_VERSION: 0.1.0-local
      CONTROL_PANEL_HEARTBEAT_INTERVAL_SEC: 5
      ENCODER_RECORDER_URL: http://host.docker.internal:8081
      ENCODER_RECORDER_TOKEN: dev-only-worker-events-token
      AUTOSTREAM_BIND_ADDR: 0.0.0.0:${AUTOSTREAM_WORKER_CONTAINER_PORT:-8080}
      TZ: Asia/Tokyo
    ports: !override
      - "127.0.0.1:${AUTOSTREAM_WORKER_PORT:-8084}:${AUTOSTREAM_WORKER_CONTAINER_PORT:-8080}"
    volumes: !override
      - ./config/config.yml:/etc/autostream-worker/config.yml:ro
